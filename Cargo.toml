[package]
name = "memcache-proto"
version = "0.0.6"
edition = "2024"
# Edition 2024 requires 1.85.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ringline-rs/memcache-proto"
description = "Memcache ASCII and binary protocol parser and encoder"
readme = "README.md"
keywords = ["memcache", "memcached", "protocol", "parser"]
categories = ["network-programming", "parsing"]

[features]
default = ["ascii"]
ascii = []
binary = []
full = ["ascii", "binary"]

[dependencies]
bytes = "1"
memchr = "2"
itoa = "1"
thiserror = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
